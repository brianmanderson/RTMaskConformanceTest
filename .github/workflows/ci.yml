name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests / py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        run: ruff check src

      # Fast metric-math + plugin-API tests. These pin hand-computed Dice /
      # HD95 / surface-DSC values against small synthetic arrays, so any
      # silent change in the underlying metric implementations (sign flip,
      # spacing-axis swap, dtype regression) trips here before the slower
      # e2e gates even start. Splitting them out gives a clearly-named
      # status line in the run log; `pytest -v` below still re-runs them
      # as part of the full suite.
      - name: Metric drift gate (unit tests)
        run: pytest src/rtmask_conformance/tests/test_metric_math.py src/rtmask_conformance/tests/test_evaluator_api.py -v

      - name: Run tests
        run: pytest -v

      # --fixture form: predictions = the binary-mask truth plus the reference masks
      # of the curve and point ROIs (reference_masks/ is not truth; those ROIs are
      # scored against the analytic JSON truth).
      - name: CLI smoke test (generate then verify, --fixture and --groundtruth forms)
        shell: bash
        run: |
          python -m rtmask_conformance.cli generate ./fixture --n-quadrature 2
          mkdir -p ./smoke_predictions
          cp ./fixture/groundtruth/*.nii.gz ./fixture/reference_masks/*.nii.gz ./smoke_predictions/
          python -m rtmask_conformance.cli verify \
              --predictions ./smoke_predictions \
              --fixture ./fixture
          python -m rtmask_conformance.cli verify \
              --predictions ./fixture/groundtruth \
              --groundtruth ./fixture/groundtruth

      # Volume-only mode on the same fixture: the closed-form analytic volume of
      # every ROI (empty for curve and point ROIs, which are REPORT_ONLY) graded
      # under end_cap: half_slice, whose reference is the analytic volume.
      - name: CLI smoke test (verify --volumes, exact analytic volumes, end_cap half_slice)
        shell: bash
        run: |
          python - <<'EOF'
          import csv, json
          from pathlib import Path
          from rtmask_conformance.manifest import read_manifest
          fixture = Path("fixture")
          with open("analytic_volumes.csv", "w", newline="") as fh:
              w = csv.writer(fh)
              w.writerow(["roi", "volume_cc"])
              for roi, entry in read_manifest(fixture).rois.items():
                  spec = json.loads((fixture / entry.spec_path).read_text(encoding="utf-8"))
                  v = spec.get("analytical_volume_mm3")
                  w.writerow([roi, repr(v / 1000.0) if v else ""])
          EOF
          printf 'schema_version: 2\nclaims:\n  end_cap: half_slice\n' > half_slice.yaml
          python -m rtmask_conformance.cli verify \
              --volumes ./analytic_volumes.csv \
              --fixture ./fixture \
              --config ./half_slice.yaml
