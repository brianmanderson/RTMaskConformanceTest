schema_version: 2

# Contour Geometric Type values the tool under test supports. A ROI whose type is
# not claimed and for which the tool writes no prediction is UNSUPPORTED_TYPE,
# which does not fail the run. A tool's own YAML replaces this list.
claims:
  geometric_types: [CLOSED_PLANAR, CLOSEDPLANAR_XOR, OPEN_PLANAR, OPEN_NONPLANAR, POINT]

# ROI names or geometric types that are scored and reported but never graded
# (status REPORT_ONLY, never a failure). A tool's own YAML adds to this list.
report_only: []

# Defaults applied to every ROI unless overridden under `primitives:`.
defaults:
  dice: 0.95              # volumetric Dice
  surface_dice_1mm: 0.95  # Nikolov-style tolerance-bounded surface DSC, tolerance = 1 mm
  hd95_mm: 2.0            # 95th percentile symmetric Hausdorff (mm)
  msd_mm: 0.5             # mean surface distance (mm)
  volume_rel_err: 0.03    # |V_tool - V_ref| / V_ref

# Per-primitive overrides. Keys shallow-merge over `defaults`.
# Rationale: cube is axis-aligned (near-exact); smooth convex shapes
# achievable at ~0.97-0.98 by any correct rasterizer; torus has high
# surface-to-volume ratio so boundary voxels dominate; the two hollow
# primitives (hollow sphere, straw) require their cavity to be left empty —
# tools that fill it produce a solid (Dice ~0.6) and should fail loudly,
# but not because the threshold was too tight.
primitives:
  sphere:
    dice: 0.98
    hd95_mm: 1.5
  cube:
    dice: 0.99
    hd95_mm: 1.0
  cylinder:
    dice: 0.97
    hd95_mm: 1.5
  ellipsoid:
    dice: 0.97
    hd95_mm: 2.0
  torus:
    dice: 0.93
    hd95_mm: 2.5
    surface_dice_1mm: 0.90
  hollow_sphere:
    dice: 0.92
    hd95_mm: 2.5
    volume_rel_err: 0.05
  straw:
    dice: 0.92
    hd95_mm: 2.5
    volume_rel_err: 0.05
  # The hollow sphere and the straw in the standard's two hole encodings
  # (bundles `xor` and `keyhole`): same geometry and ground truth as above,
  # so the same floors, copied verbatim.
  hollow_sphere_xor:
    dice: 0.92
    hd95_mm: 2.5
    volume_rel_err: 0.05
  straw_xor:
    dice: 0.92
    hd95_mm: 2.5
    volume_rel_err: 0.05
  hollow_sphere_keyhole:
    dice: 0.92
    hd95_mm: 2.5
    volume_rel_err: 0.05
  straw_keyhole:
    dice: 0.92
    hd95_mm: 2.5
    volume_rel_err: 0.05

# Boundary conventions. `defaults` and `primitives` above are the thresholds of the
# default convention, pv_ge_0.5 (a voxel is in when at least half of it lies inside);
# they do not change here. A tool that declares `claims.convention: pv_gt_0` (any part
# of the voxel inside) or `centre_in` (the voxel centre inside) is graded against that
# convention's reference, with the thresholds below: each block names only what
# differs from pv_ge_0.5 and wins over it (`defaults` <- `primitives.<roi>` <-
# `conventions.<c>.defaults` <- `conventions.<c>.primitives.<roi>`).
#
# Calibrated 2026-11-19 with tools/calibrate_conventions.py on a fixture at the
# default quadrature (n_quadrature 8; the pv_gt_0 reference grows with it). Every
# floor and ceiling starts at its pv_ge_0.5 value; only the volume ceiling is
# calibrated. Positive calibrators: the suite's own rasterisations of the
# fixture's RTSTRUCT, per slice: voxel centre inside the contour (centre_in), and
# in-plane area fraction from 8 x 8 sub-pixels >= 0.5 (pv_ge_0.5) or > 0 (pv_gt_0).
# Rule: where a convention's contour-based error exceeds two thirds of the start
# value, the ceiling becomes 1.5 x that error, rounded up to 0.5 points; it is
# never lowered. Volume errors (%) of the contour-based mask under its own
# convention, then the smallest error of another convention's ideal 3-D mask
# against the convention's reference (a ceiling below it keeps them apart):
#
#                  pv_gt_0 own / cross   centre_in own / cross   ceiling (pv_ge_0.5)
#   sphere              1.87 / 4.92          0.07 / 0.02           3.0
#   cube                0.00 / 0.00          0.00 / 0.00           3.0
#   cylinder            0.27 / 4.07          0.57 / 0.28           3.0
#   ellipsoid           1.20 / 4.50          0.17 / 0.02           3.0
#   torus               3.44 / 6.27          0.17 / 0.34           3.0 -> 5.5 under pv_gt_0
#   hollow_sphere       2.48 / 6.71          0.07 / 0.03           5.0
#   straw               0.40 / 5.11          0.21 / 0.53           5.0
#
# - pv_gt_0: a per-slice any-overlap mask reads low against the 3-D one, because
#   it cannot see where the solid bulges between slices; on the torus (highest
#   surface-to-volume ratio) it reads 3.44 %, so its ceiling is 5.5 %. A pv_ge_0.5
#   or centre_in mask still fails there (6.27 % and more). Every other ROI keeps
#   its pv_ge_0.5 value, which already passes the per-slice mask and fails the
#   other two conventions' masks (straw by the narrowest margin, 5.11 % vs 5.0 %).
# - centre_in: every ceiling stays at its pv_ge_0.5 value (margin >= 2.4 points).
#   A pv_ge_0.5 mask and a centre_in mask differ by at most 0.53 % in volume and
#   pass each other's thresholds on every primitive: the gate does not tell these
#   two conventions apart. On the cube, whose faces lie on voxel boundaries, the
#   three references are identical.
conventions:
  pv_gt_0:
    primitives:
      torus:
        volume_rel_err: 0.055
  centre_in: {}

# Curve and point ROIs (truth_kind `curve` or `points`; see grading_pointline.py).
# Dice does not apply to a zero-volume ROI, so these are graded on their own
# metrics, one sub-block per ROI name; the metrics a sub-block names are the ones
# graded. A user YAML's `pointline.<roi>` block shallow-merges over these.
# Recalls are floors; everything else is a ceiling. Values assume the fixture's
# 1 mm isotropic grid. Curve and point ROIs have no boundary convention: this
# block applies under every `claims.convention`.
#
# Two calibration rules, one per kind of evidence:
# - family rule: where positive calibrators exist beyond the suite's own
#   rasteriser (POINT and OPEN_NONPLANAR, every metric), the ceiling is their
#   worst value over the family x 1.5, rounded up, the same for every ROI of the
#   family;
# - per-ROI rule: where the suite's own ideal rasteriser is the only positive
#   calibrator (OPEN_PLANAR arc length), the ceiling is 2 x its error on that ROI.
# A metric of a ROI that both rules cover takes the tighter value, never the
# looser one: OPEN_PLANAR arc length takes the per-ROI value (7.93 and 11.76
# against the family's 16.0); OPEN_PLANAR curve distances, which have no per-ROI
# calibration, take the family values.
#
# POINT and OPEN_NONPLANAR: calibrated 2026-11-10 with
# tools/calibrate_pointline_thresholds.py from an upstream forward-benchmark run
# over these exact seven primitives (OPEN_PLANAR: see its own comment below):
# - Curves. The positive calibrators are the two rasterisers that trace a thin
#   path (every marked voxel within one voxel diagonal of the curve, on all four
#   curves). Each ceiling is their worst value over the four curves x 1.5,
#   rounded up (0.05 mm, 0.5 %):
#     arc_length_error_pct          worst 10.41  -> 16.0
#     curve_max_distance_mm         worst 0.999  -> 1.5
#     curve_voxel_to_curve_mean_mm  worst 0.625  -> 0.95
#   The two rasterisers that fill the polygon the curve's vertices span score
#   58-794 % on arc length, so they fail every curve.
# - Points. The positive calibrators are the three tools that write a non-empty
#   mask for the point ROIs; they agree exactly. Every seed must be found
#   (point_recall floor 1.0, no margin: one missed seed is a defect).
#     point_max_displacement_mm     worst 0.636  -> 1.0
#   point_fp_rate (fraction of marked voxels farther than one voxel diagonal from
#   every point) ceiling 0.3, set 2026-11-12, not from the anchor, where every
#   tool scores 0.0. Recall and displacement only look outward from the points,
#   so a mask that fills the point set into a solid region passes them; the fp
#   rate catches it. Measured on the suite's own masks: exact voxels 0.00, each
#   seed drawn as a 3x3x3 glyph 0.23 (passes), the seed implant filled per plane
#   0.57 and the needle track filled as a polygon 0.98 (both fail).
# One ceiling per family, written into every sub-block: several primitives score
# exactly 0 for every positive calibrator (an axis-aligned needle, a point on a
# voxel centre), so a per-primitive multiple would leave no tolerance. The
# suite's own reference rasterisation scores at most 6.9 % arc length error,
# 0.75 mm curve distance, 0.48 mm voxel-to-curve mean and 0.64 mm point
# displacement.
pointline:
  single_point_x256_y256_z150:
    point_recall: 1.0
    point_max_displacement_mm: 1.0
    point_fp_rate: 0.3
  needle_track_10pts_x150_y150:
    point_recall: 1.0
    point_max_displacement_mm: 1.0
    point_fp_rate: 0.3
  ldr_seed_implant_x350_y350:
    point_recall: 1.0
    point_max_displacement_mm: 1.0
    point_fp_rate: 0.3
  diagonal_needle_x100_y200_z40:
    arc_length_error_pct: 16.0
    curve_max_distance_mm: 1.5
    curve_voxel_to_curve_mean_mm: 0.95
  helix_r12_pitch6_4turns_x300_y200:
    arc_length_error_pct: 16.0
    curve_max_distance_mm: 1.5
    curve_voxel_to_curve_mean_mm: 0.95
  sinusoid_x150_y350_z20to80:
    arc_length_error_pct: 16.0
    curve_max_distance_mm: 1.5
    curve_voxel_to_curve_mean_mm: 0.95
  syed_bundle_5needles_x400_y100_z50:
    arc_length_error_pct: 16.0
    curve_max_distance_mm: 1.5
    curve_voxel_to_curve_mean_mm: 0.95
  # OPEN_PLANAR. Each arc_length_error_pct ceiling is twice the error of the
  # suite's ideal rasteriser (a one-voxel-wide, 8-connected Bresenham trace of
  # the emitted polyline on its slice, scored by arc_length_metrics), measured
  # 2026-11-10 by tests/test_open_planar.py: line segment 3.963 % (raster
  # 133.14 mm vs 128.06 mm analytic), open arc 5.881 % (66.53 vs 62.83 mm).
  # The arc closed into a filled polygon measures 21.06 % and fails.
  # curve_max_distance_mm <= 1.5 and curve_voxel_to_curve_mean_mm <= 0.95 are the
  # OPEN_NONPLANAR family's ceilings, added 2026-11-12: arc length alone passes a
  # line drawn as a thick band, because its skeleton is still the centre line.
  # Measured on the suite's own masks (line / arc): correct one-voxel-wide
  # rasterisers (8-connected Bresenham, supercover, truncating) at most
  # 0.870 / 1.079 mm max distance and 0.363 / 0.648 mm voxel-to-curve mean (pass);
  # the line drawn 3 voxels wide 1.368 mm and 5 voxels wide 2.309 mm
  # voxel-to-curve mean (fail).
  line_segment_x200_y200_to_x300_y280_z175:
    arc_length_error_pct: 7.93
    curve_max_distance_mm: 1.5
    curve_voxel_to_curve_mean_mm: 0.95
  open_arc_r40_90deg_x380_y300_z180:
    arc_length_error_pct: 11.76
    curve_max_distance_mm: 1.5
    curve_voxel_to_curve_mean_mm: 0.95

# `verify --volumes` (volume-only mode, for systems that report structure volumes
# but export no masks): the relative volume error allowed against the analytic
# volume. Graded at max(tolerance, display quantisation) when the CSV gives
# volume_decimals. The end-cap convention is a claim (`claims.end_cap: none`
# (default) or `half_slice`); see rtmask_conformance/volume_only.py.
volume_only:
  tolerance: 0.01
